services:
  nyanify:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 8000:8000
      - 9000:9000   # metrics (local testing only)
    environment:
      TOKEN: ${TOKEN}
      HMAC_KEY: ${HMAC_KEY}
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src/
